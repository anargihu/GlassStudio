name: Build GlassStudio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project GlassStudio.xcodeproj \
            -scheme GlassStudio \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build \
            CONFIGURATION_BUILD_DIR="$PWD/build"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/GlassStudio.app Payload/
          zip -r GlassStudio.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GlassStudio-IPA
          path: GlassStudio.ipa
