name: Build GlassStudio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create App Icon
        run: |
          mkdir -p GlassStudio/Assets.xcassets/AppIcon.appiconset

          sips -z 180 180 Website/logo.png --out GlassStudio/Assets.xcassets/AppIcon.appiconset/icon-60@3x.png
          sips -z 120 120 Website/logo.png --out GlassStudio/Assets.xcassets/AppIcon.appiconset/icon-60@2x.png
          sips -z 167 167 Website/logo.png --out GlassStudio/Assets.xcassets/AppIcon.appiconset/icon-83.5@2x.png
          sips -z 1024 1024 Website/logo.png --out GlassStudio/Assets.xcassets/AppIcon.appiconset/icon-1024.png

          cat > GlassStudio/Assets.xcassets/Contents.json <<'EOF'
          {
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF

          cat > GlassStudio/Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF'
          {
            "images": [
              {
                "filename": "icon-60@2x.png",
                "idiom": "iphone",
                "scale": "2x",
                "size": "60x60"
              },
              {
                "filename": "icon-60@3x.png",
                "idiom": "iphone",
                "scale": "3x",
                "size": "60x60"
              },
              {
                "filename": "icon-83.5@2x.png",
                "idiom": "iphone",
                "scale": "2x",
                "size": "83.5x83.5"
              },
              {
                "filename": "icon-1024.png",
                "idiom": "ios-marketing",
                "scale": "1x",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set +e
          xcodebuild \
            -project GlassStudio.xcodeproj \
            -scheme GlassStudio \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "===== ERRORS ====="
          grep -i "error:" build.log | tail -30 || true
          exit $status

      - name: Copy website into app
        run: |
          cp -R Website build/Build/Products/Release-iphoneos/GlassStudio.app/

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GlassStudio.app Payload/GlassStudio.app
          zip -r GlassStudio.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GlassStudio-IPA
          path: GlassStudio.ipa