      - name: Build
        run: |
          set +e
          xcodebuild \
            -project GlassStudio.xcodeproj \
            -scheme GlassStudio \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "===== ERRORS ====="
          grep -i "error:" build.log | tail -30 || true
          exit $status